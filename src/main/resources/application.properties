spring.application.name=SapirWebStore
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3308/sapir_webstore
spring.datasource.username=${DB_USERNAME:sapir_admin}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true